name: Update surveillance data

# 毎週自動で最新の週報を取り込み、リポジトリにコミットする。
# GitHub Pages（main ブランチ）から配信される /api/surveillance.json が更新される。
on:
  schedule:
    # 毎週 火曜 06:00 UTC（= 日本時間 15:00）に実行
    - cron: '0 6 * * 2'
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build surveillance JSON from JIHS
        run: |
          cd api
          python build_api.py --refresh

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          d = json.load(open('api/surveillance.json', encoding='utf-8'))
          assert d.get('weekLabels'), 'weekLabels empty'
          assert len(d.get('prefectures', {})) == 47, 'prefectures != 47'
          print('OK period=', d['period'], 'weeks=', len(d['weekLabels']))
          PY

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/surveillance.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): 週報データを自動更新 $(date -u +%Y-%m-%d)"
            git push
          fi
